name: Train Model (Modal)

# Trigger manually from GitHub Actions UI or via API.
# To schedule weekly retraining, uncomment the schedule block below.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Training script version (e.g. v8, v9)"
        required: true
        default: "v8"
        type: choice
        options:
          - v8
          - v9
      notes:
        description: "Optional notes for this run (appended to champion metadata)"
        required: false
        default: ""
      dry_run:
        description: "Dry run — train but skip promotion and model card update"
        required: false
        default: false
        type: boolean

  # Uncomment to auto-retrain weekly (Sunday 02:00 UTC) with the latest script:
  # schedule:
  #   - cron: "0 2 * * 0"

jobs:
  train:
    name: "Train ${{ github.event.inputs.version || 'v8' }} on Modal"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal + HF deps
        run: |
          pip install modal huggingface_hub lightgbm scikit-learn pandas numpy

      # ── Modal auth via secrets ────────────────────────────────────────────────
      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal token set \
            --token-id "$MODAL_TOKEN_ID" \
            --token-secret "$MODAL_TOKEN_SECRET"

      # ── Launch training on Modal cloud ────────────────────────────────────────
      # All heavy computation runs remotely (32 GB RAM, 8 CPUs, ~15-20 min, ~$0.20).
      # The local runner just submits the job and streams logs.
      - name: Run training on Modal
        id: train
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          NOTES: ${{ github.event.inputs.notes || '' }}
        run: |
          VERSION="${{ github.event.inputs.version || 'v8' }}"
          SCRIPT="scripts/train_${VERSION}_modal.py"

          if [ ! -f "$SCRIPT" ]; then
            echo "ERROR: training script not found: $SCRIPT"
            exit 1
          fi

          echo "=== Launching $SCRIPT on Modal ==="
          modal run "$SCRIPT" 2>&1 | tee /tmp/train_output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          # Check if the run promoted a new champion
          if grep -q "Promoted.*YES" /tmp/train_output.txt; then
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          fi

          exit $EXIT_CODE

      # ── Update HF model card (only if a new champion was promoted) ────────────
      - name: Update HuggingFace model card
        if: |
          steps.train.outputs.promoted == 'true' &&
          github.event.inputs.dry_run != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "New champion detected — refreshing HF model card..."
          python scripts/update_model_card.py --hf-token "$HF_TOKEN"
          echo "✅ Model card updated at https://huggingface.co/artbreguez/polymarket-btc-model"

      # ── Trigger deploy if champion changed ────────────────────────────────────
      - name: Trigger deploy workflow
        if: |
          steps.train.outputs.promoted == 'true' &&
          github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering deploy workflow for new champion..."
          gh workflow run deploy.yml \
            --ref main \
            --field reason="Auto-deploy after training ${{ github.event.inputs.version || 'v8' }} promoted new champion"

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: Job summary
        if: always()
        run: |
          VERSION="${{ github.event.inputs.version || 'v8' }}"
          PROMOTED="${{ steps.train.outputs.promoted }}"
          echo "## Training Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | $VERSION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Promoted | $PROMOTED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | ${{ github.event.inputs.dry_run || 'false' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Notes | ${{ github.event.inputs.notes || '—' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PROMOTED" = "true" ]; then
            echo "🏆 **New champion promoted!**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Model card: https://huggingface.co/artbreguez/polymarket-btc-model" >> "$GITHUB_STEP_SUMMARY"
            echo "- Deploy triggered automatically." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ No promotion — current champion retained." >> "$GITHUB_STEP_SUMMARY"
          fi
