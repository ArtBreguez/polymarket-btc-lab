[project]
name = "btc-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pmlab",
    "lightgbm",
    "scikit-learn",
    "pyarrow",
    "pandas",
    "requests>=2.34.2",
    "huggingface-hub>=1.17.0",
    "websockets>=16.0",
    "py-clob-client>=0.34.6",
]

[tool.uv.sources]
pmlab = { path = "/home/ubuntu/polymarket-lab", editable = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
