app = "polymarket-btc-lab-bot"
primary_region = "ams"

[build]

[env]
  PYTHONUNBUFFERED = "1"
  # Durable state (trade ledger + feature/CLOB audit logs). /tmp is wiped on
  # every deploy and restart, and the HF backup has been failing with 403
  # (private-storage quota) — so without this the trading history is lost.
  BOT_DATA_DIR = "/data"
  # No wallet configured yet on this account — full pipeline runs, no real orders.
  # Flip to "false" once POLY_PRIVATE_KEY / POLY_SAFE_ADDRESS / MM_BUILDER_* secrets are set.
  DRY_RUN = "true"

[[mounts]]
  source = "bot_data"
  destination = "/data"

[processes]
  app = "python -u live_trader.py"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"

# Worker machine — no HTTP service, must never auto-stop
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]
